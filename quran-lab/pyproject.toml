[project]
name = "quran-lab"
version = "0.1.0"
description = "Recherche computationnelle sur le corpus coranique : comptages multivers, statistiques, IA."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "needs_data: nécessite data/raw/ (sources téléchargées), ignoré sans elles",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
